name: update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch offers
        run: python scraper.py

      - name: Build site
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "vps-deals-bot"
          git config user.email "vps-deals-bot@users.noreply.github.com"
          git add data/offers.json site/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update: refresh deals ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install --quiet cloudflare
          python -c "
          import os, cloudflare
          cf = cloudflare.Cloudflare(api_token=os.environ['CLOUDFLARE_API_TOKEN'])
          # Pages deploys via project webhook in real setup;
          # here we only verify the token works.
          cf.accounts.zones.list(account_id=os.environ['CLOUDFLARE_ACCOUNT_ID'])
          print('token ok')
          "