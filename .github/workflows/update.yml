name: update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 价格历史要从 git 快照链重建 —— shallow clone 只有 1 个快照，
          # 必须拿完整历史（仓库小，成本可忽略）
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch offers
        run: python scraper.py

      - name: Build site
        run: python build.py

      - name: Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          # v4 默认不传 dotfile；site/.well-known/* 是 agent-discovery 必需文件
          include-hidden-files: true
          retention-days: 1

      - name: Commit if data changed
        run: |
          git config user.name "vps-deals-bot"
          git config user.email "vps-deals-bot@users.noreply.github.com"
          git add data/offers.json data/history.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "update: refresh deals ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # deploy 需要仓库根的 functions/（Pages middleware：Link 头 + markdown 协商），
      # 不能只拿 site/ artifact，否则 middleware 丢失且部署静默降级。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # 关键文件缺失就大声失败，不许静默发一个残缺的部署
      - name: Verify deploy payload
        run: |
          test -f site/.well-known/api-catalog || { echo "MISSING site/.well-known/api-catalog"; exit 1; }
          test -f site/.well-known/mcp/server-card.json || { echo "MISSING site/.well-known/mcp/server-card.json"; exit 1; }
          test -f site/.well-known/agent-skills/index.json || { echo "MISSING site/.well-known/agent-skills/index.json"; exit 1; }
          test -f site/.well-known/ai-catalog.json || { echo "MISSING site/.well-known/ai-catalog.json"; exit 1; }
          test -f functions/_middleware.js || { echo "MISSING functions/_middleware.js"; exit 1; }
          echo "deploy payload OK"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./site \
            --project-name vps-deals \
            --commit-message "GH Actions deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --commit-dirty