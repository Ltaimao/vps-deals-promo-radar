name: update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch offers
        run: python scraper.py

      - name: Build site
        run: python build.py

      - name: Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 1

      - name: Commit if data changed
        run: |
          git config user.name "vps-deals-bot"
          git config user.email "vps-deals-bot@users.noreply.github.com"
          git add data/offers.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "update: refresh deals ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./site \
            --project-name vps-deals \
            --commit-message "GH Actions deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --commit-dirty