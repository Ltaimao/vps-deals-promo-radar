name: deploy

# Deploys the site whenever code is pushed to main (templates, build.py,
# workflow changes, etc.). The scheduled data-refresh workflow (update.yml)
# already builds+deploys on its own run; this one covers human/code pushes.
# It never commits, so it cannot trigger itself in a loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from committed data
        run: python build.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy ./site \
            --project-name vps-deals \
            --commit-message "GH Actions deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --commit-dirty
